name: Release

on:
  push:
    tags: ["v*"]
  # 태그를 붙이기 전에 빌드가 되는지 확인할 수 있어야 한다. 수동 실행은 아티팩트만
  # 남기고 릴리스는 만들지 않는다 — 되돌릴 수 없는 건 태그가 있을 때만 한다.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # 한 타깃이 깨져도 나머지는 끝까지 간다. 어느 하나가 실패했다고 전부 없는
      # 것보다, 되는 것만이라도 손에 쥐고 원인을 보는 편이 낫다.
      fail-fast: false
      matrix:
        include:
          # musl 정적 링크. 이게 되는지가 이 프로젝트의 의존성 선택을 지배했다 —
          # syntect를 default-fancy(순수 Rust)로 고정한 이유가 Oniguruma의 C
          # 바인딩이 여기서 깨지기 때문이다. 이 잡이 그 결정의 검증이다.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 빌드된 바이너리가 실제로 사이트를 만드는지 본다. 링크만 성공하고 런타임에
      # 죽는 조합이 있으므로(정적 빌드에서 특히), 여기서 한 번 돌려 본다.
      - name: The binary builds a site
        run: |
          ./target/${{ matrix.target }}/release/sqzass init "$RUNNER_TEMP/smoke"
          ./target/${{ matrix.target }}/release/sqzass build -i "$RUNNER_TEMP/smoke" --json
          test -f "$RUNNER_TEMP/smoke/public/index.html"

      - name: Package
        id: package
        shell: bash
        run: |
          name="sqzass-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sqzass" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # 체크섬을 같이 낸다. 없으면 받는 쪽이 확인할 방법이 없다.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      # 릴리스는 태그일 때만. 수동 실행은 "빌드가 되는지"를 확인하는 용도이고,
      # 그때 릴리스가 생기면 확인이 부작용을 갖게 된다.
      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          generate_release_notes: true
