name: Release

on:
  push:
    tags: ["v*"]
  # 태그를 붙이기 전에 빌드가 되는지 확인할 수 있어야 한다. 수동 실행은 아티팩트만
  # 남기고 릴리스는 만들지 않는다 — 되돌릴 수 없는 건 태그가 있을 때만 한다.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # 한 타깃이 깨져도 나머지는 끝까지 간다. 어느 하나가 실패했다고 전부 없는
      # 것보다, 되는 것만이라도 손에 쥐고 원인을 보는 편이 낫다.
      fail-fast: false
      matrix:
        include:
          # musl 정적 링크. 정적 아티팩트만 pure-rust 엔진으로 빌드한다 —
          # Oniguruma(C 바인딩)가 정적 링크를 깨는 지점이 여기라서다. 기본
          # 빌드는 onig(코드 무거운 코퍼스 실측 3배)지만, 이 잡의
          # --no-default-features가 onig를 컴파일 타임에 차단한다. musl-gcc가
          # onig_sys 링크에 *성공*할 수도 있으므로, 링크 실패가 순수 Rust를
          # 지켜줄 거라 기대하지 말 것 — 플래그가 유일한 가드다.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: --no-default-features --features pure-rust
          # ARM 리눅스는 네이티브 러너에서 짓는다. 크로스 컴파일로도 바이너리는
          # 나오지만, 그러면 아래 스모크 스텝이 못 돈다 — 링크만 되고 런타임에
          # 죽는 조합을 잡으라고 둔 검사라, 실행할 수 없는 아티팩트를 내보내는
          # 것은 그 검사를 포기하는 것이다.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            flags: --no-default-features --features pure-rust
          - os: macos-latest
            target: aarch64-apple-darwin
            flags: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags }}

      # 빌드된 바이너리가 실제로 사이트를 만드는지 본다. 링크만 성공하고 런타임에
      # 죽는 조합이 있으므로(정적 빌드에서 특히), 여기서 한 번 돌려 본다.
      - name: The binary builds a site
        run: |
          ./target/${{ matrix.target }}/release/sqzass init "$RUNNER_TEMP/smoke"
          ./target/${{ matrix.target }}/release/sqzass build -i "$RUNNER_TEMP/smoke" --json
          test -f "$RUNNER_TEMP/smoke/public/index.html"

      - name: Package
        id: package
        shell: bash
        run: |
          name="sqzass-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sqzass" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # 체크섬을 같이 낸다. 없으면 받는 쪽이 확인할 방법이 없다.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

          # `releases/latest/download/<파일명>`은 파일명이 릴리스마다 같아야 쓸 수
          # 있는데 위 이름에는 태그가 박혀 있다. 배포 안내서들이 바로 그 URL을
          # 쓰므로 태그 없는 이름의 사본도 낸다. 태그 붙은 쪽은 그대로 둔다 —
          # install.sh가 그 이름을 조립하고, 사본은 순수 추가다.
          stable="sqzass-${{ matrix.target }}"
          cp "dist/$name.tar.gz" "dist/$stable.tar.gz"
          (cd dist && shasum -a 256 "$stable.tar.gz" > "$stable.tar.gz.sha256")
          echo "stable=dist/$stable.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.stable }}
            ${{ steps.package.outputs.stable }}.sha256

      # 릴리스는 태그일 때만. 수동 실행은 "빌드가 되는지"를 확인하는 용도이고,
      # 그때 릴리스가 생기면 확인이 부작용을 갖게 된다.
      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.stable }}
            ${{ steps.package.outputs.stable }}.sha256
          generate_release_notes: true
