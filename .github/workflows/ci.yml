name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # sqzass가 자기 문서 사이트를 빌드할 수 있어야 한다. 이게 회귀 테스트다 —
      # 단위 테스트가 놓치는 통합 문제를 실제 사이트가 잡는다.
      - name: Build the docs site
        run: cargo run --quiet -- build -i docs

      # doctor는 빌드가 통과시키는 것들을 본다 — 미번역 페이지, 빈 섹션, 자리표시자
      # base_url. 지금 문서 사이트는 깨끗하고, 그 상태를 유지하는 게 이 검사의 목적이다.
      # 동시에 doctor 자체가 실제 사이트에서 도는지 확인하는 자리이기도 하다.
      - name: Doctor
        run: cargo run --quiet -- doctor -i docs

      # 같은 입력이면 같은 바이트가 나와야 한다. 두 페이지가 같은 출력 URL을
      # 주장할 때 파일 순회 순서에 따라 결과가 달라지는 종류의 버그를 잡는다.
      - name: Build is reproducible
        run: |
          cargo run --quiet -- build -i docs -o "$RUNNER_TEMP/a"
          cargo run --quiet -- build -i docs -o "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

  # musl 릴리스 아티팩트가 쓰는 pure-rust 엔진 조합이 썩지 않게 지킨다.
  # 크로스 엔진 바이트 비교는 하지 않는다 — fancy 덤프에는 문법 7개
  # (PowerShell·JS(Babel)·Salt State·ARM Assembly 등)가 통째로 없어서 해당
  # 펜스가 평문 폴백이 되고 js 토큰 해석도 갈린다. 아티팩트 간 차이는 버그가
  # 아니라 문서화된 계약이다(docs/content/start/installation.md). 결정성은
  # 엔진별로 지킨다.
  pure-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pure-rust

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features pure-rust -- -D warnings

      - name: Test
        run: cargo test --no-default-features --features pure-rust

      - name: Build is reproducible
        run: |
          cargo run --quiet --no-default-features --features pure-rust -- build -i docs -o "$RUNNER_TEMP/a"
          cargo run --quiet --no-default-features --features pure-rust -- build -i docs -o "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
