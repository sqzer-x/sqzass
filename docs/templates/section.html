{% extends "base.html" %}

{% block content %}
<div class="prose">
{{ page.content | safe }}
</div>

{%- if page.children %}
<ul class="children">
  {%- for c in page.children %}
  <li>
    <a href="{{ c.url }}">
      {{ c.title }}
      {%- if c.description %}<span class="desc">{{ c.description }}</span>{% endif %}
    </a>
  </li>
  {%- endfor %}
</ul>
{%- endif %}
{% endblock %}
